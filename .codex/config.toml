# VM defaults, pending V8/V29. No model override; inherit the user's model.
sandbox_mode = "workspace-write"
approval_policy = "on-request"
approvals_reviewer = "auto_review"

[sandbox_workspace_write]
network_access = true

[features]
apps = false
plugins = false

# Codex needs a transport (command or url) to load any MCP table, even a
# disabled one; this is the Docker template's gateway address.
[mcp_servers.mcp-gateway]
url = "http://mcp-gateway.docker.internal/mcp"
enabled = false
