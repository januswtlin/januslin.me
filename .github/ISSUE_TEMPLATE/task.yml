name: Task
description: One unit of agent work, delivered by one PR (docs/agents/workflow.md, "Task issues").
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: |
        Add this issue as a sub-issue of the plan issue #11, at the right place in its order. The coordinator starts it only after the author adds the `approved` label.
  - type: input
    id: header
    attributes:
      label: Role, size, branch, identity
      placeholder: "Platform Engineer · S · agent/platform/<slug> · app (januslin-agent[bot])"
    validations:
      required: true
  - type: input
    id: depends
    attributes:
      label: Depends on
      description: Issue numbers, or "none". May name human-task issues.
      placeholder: "#12, #13"
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
    validations:
      required: true
  - type: textarea
    id: read-first
    attributes:
      label: Read first
  - type: textarea
    id: scope
    attributes:
      label: Scope
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkable by someone who did not write the code; mark "manual" where a criterion cannot be automated.
      value: "- [ ] "
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Automated verification
